name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v<version> tag to publish or recover
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: v0.1.0
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Install ReleaseBox
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RELEASEBOX_REF" https://github.com/rogerchappel/releasebox.git /tmp/releasebox
          npm --prefix /tmp/releasebox ci
          npm --prefix /tmp/releasebox run build
      - name: ReleaseBox readiness check
        run: node /tmp/releasebox/bin/releasebox.js check .
      - name: Run release checks
        run: npm run release:check
      - name: Verify tag matches package version
        run: node scripts/release-package.mjs verify-tag "$RELEASE_TAG" "$(npm pkg get version | tr -d '\"')"
      - name: Build package artifact
        run: npm pack --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].filename))" > package-artifact.txt
      - name: Publish package when version is new
        run: |
          set -euo pipefail
          package_version=$(npm pkg get version | tr -d '"')
          published_versions=$(npm view "paperhug" versions --json 2>/dev/null || printf '[]')
          if node scripts/release-package.mjs is-published "$published_versions" "$package_version"; then
            echo "paperhug@$package_version is already published; skipping npm publish."
          else
            npm publish "$(cat package-artifact.txt)" --access public --provenance
          fi
      - name: Verify published package
        run: |
          set -euo pipefail
          package_version=$(npm pkg get version | tr -d '"')
          for attempt in 1 2 3 4 5; do
            if metadata=$(npm view "paperhug@$package_version" version dist.integrity --json 2>/dev/null) && \
              METADATA="$metadata" PACKAGE_VERSION="$package_version" node --input-type=module -e \
              'const metadata=JSON.parse(process.env.METADATA); if (metadata.version !== process.env.PACKAGE_VERSION || !metadata.dist?.integrity) process.exit(1)'; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "paperhug@$package_version was not verifiable after $attempt attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done
          npm exec --yes --package="paperhug@$package_version" -- paperhug --help
      - name: Generate release notes
        run: node /tmp/releasebox/bin/releasebox.js notes . > RELEASE_NOTES.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$(cat package-artifact.txt)" --clobber
          else
            gh release create "$RELEASE_TAG" --notes-file RELEASE_NOTES.md "$(cat package-artifact.txt)"
          fi
